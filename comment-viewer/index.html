<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0c">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>评论分析台 · 词云 + 评论表</title>
<link rel="stylesheet" href="styles.css?v=0.5.54">
</head>
<body class="is-empty">
<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M5 8.5A3.5 3.5 0 0 1 8.5 5h15A3.5 3.5 0 0 1 27 8.5v10a3.5 3.5 0 0 1-3.5 3.5H14l-6.2 4.6A1 1 0 0 1 6.2 25.8V22H8.5A3.5 3.5 0 0 1 5 18.5v-10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="11" cy="13.5" r="1.4" fill="currentColor"/>
      <circle cx="16" cy="13.5" r="1.4" fill="currentColor"/>
      <circle cx="21" cy="13.5" r="1.4" fill="currentColor"/>
    </svg>
    <div class="shell-id">
      <h1>评论分析台</h1>
      <p class="scope" id="sourceInfo">未载入数据</p>
    </div>
  </div>
  <div class="actions">
    <button id="btnOpenFiles" class="btn primary" type="button">打开导出文件…</button>
    <button id="btnOpenDir" class="btn" type="button">打开导出目录…</button>
    <button id="btnClear" class="btn ghost" type="button" disabled>清空</button>
  </div>
  <input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv" multiple hidden>
  <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
</header>

<section id="kpis" class="kpis" aria-label="总览"></section>

<main class="grid">
  <section class="panel cloud-panel">
    <div class="panel-head">
      <div class="panel-title">
        <h2>词云</h2>
        <span id="cloudSub" class="panel-sub"></span>
      </div>
      <div class="inline">
        <label class="meta" for="cloudSize">词数</label>
        <select id="cloudSize" class="select small">
          <option value="80">80</option>
          <option value="120" selected>120</option>
          <option value="160">160</option>
          <option value="220">220</option>
        </select>
        <button id="btnRelayout" class="btn small ghost" type="button">重新排布</button>
      </div>
    </div>
    <div id="cloud" class="cloud" aria-label="评论关键词词云"></div>
    <div id="skCloud" class="sk-cloud" aria-hidden="true" hidden></div>
    <div id="cloudEmpty" class="empty">
      <svg class="empty-mark" width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M5 8.5A3.5 3.5 0 0 1 8.5 5h15A3.5 3.5 0 0 1 27 8.5v10a3.5 3.5 0 0 1-3.5 3.5H14l-6.2 4.6A1 1 0 0 1 6.2 25.8V22H8.5A3.5 3.5 0 0 1 5 18.5v-10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <strong>还没有数据</strong>
      <p>载入插件或扩展导出的 <code>douyin-comments-*.json</code> / <code>.csv</code>，<br>也可以直接选整个导出目录，一次载入多条视频。</p>
      <p class="meta">数据只在本机浏览器里处理，不上传任何服务器。</p>
      <button id="btnOpenFiles2" class="btn primary" type="button">打开导出文件…</button>
    </div>
    <div class="cloud-foot">
      <span><span class="swatch"></span>高频词 <span class="swatch grey" style="margin-left:12px"></span>一般 <span class="swatch mono" style="margin-left:12px"></span>低频 · 字号 = 出现次数</span>
      <span>悬停看样例评论 · 点词看全部</span>
    </div>
  </section>

  <aside class="panel side">
    <div class="panel-head">
      <div class="panel-title">
        <h2>关键词</h2>
        <span id="wordInfo" class="panel-sub"></span>
      </div>
    </div>
    <ol id="wordList" class="word-list"></ol>
    <div class="panel-head sub">
      <h2>筛选</h2>
    </div>
    <!-- v0.5.50：侧栏内联样式，避免旧缓存 CSS 把复选框挤成竖排 -->
    <div class="side-body" style="display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%;min-width:0;">
      <label class="field">
        <span>视频</span>
        <select id="videoFilter" class="select"></select>
      </label>
      <label class="field">
        <span>情感</span>
        <select id="sentFilter" class="select">
          <option value="">全部情感</option>
          <option value="pos">只看正向</option>
          <option value="neu">只看中性</option>
          <option value="neg">只看负向</option>
        </select>
      </label>
      <label class="field">
        <span>主题</span>
        <select id="topicFilter" class="select" disabled><option value="">全部主题</option></select>
      </label>
      <button id="btnOpenVideo" class="btn small" type="button" disabled title="在新标签页打开当前选中视频的抖音页面">打开原视频 ↗</button>
      <label class="check" style="display:flex;flex-direction:row;align-items:center;gap:8px;width:100%;min-width:0;white-space:nowrap;margin:0;box-sizing:border-box;"><input type="checkbox" id="onlyHasProfile" style="flex:0 0 auto;margin:0;"> 只看有主页的用户</label>
      <label class="check" style="display:flex;flex-direction:row;align-items:center;gap:8px;width:100%;min-width:0;white-space:nowrap;margin:0;box-sizing:border-box;"><input type="checkbox" id="onlyTopLevel" style="flex:0 0 auto;margin:0;"> 只看一级评论</label>
      <label class="check" style="display:flex;flex-direction:row;align-items:center;gap:8px;width:100%;min-width:0;white-space:nowrap;margin:0;box-sizing:border-box;"><input type="checkbox" id="onlyNonEmpty" style="flex:0 0 auto;margin:0;"> 只看有文字的评论</label>
            <label class="check" style="display:flex;flex-direction:row;align-items:center;gap:8px;width:100%;min-width:0;white-space:nowrap;margin:0;box-sizing:border-box;" title="过滤「这种 / 都是 / 我的」这类没有信息量的词"><input type="checkbox" id="onlyContent" style="flex:0 0 auto;margin:0;" checked> 过滤虚词</label>
      <div class="kw-tune" title="加词：保证长词不被切碎（如「露营装备」）；屏蔽词：从词云里剔除">
        <label class="kw-row"><span>加词</span><input id="kwKeep" class="kw-input" type="text" placeholder="逗号分隔，如：露营装备" autocomplete="off" spellcheck="false"></label>
        <label class="kw-row"><span>屏蔽</span><input id="kwBlock" class="kw-input" type="text" placeholder="如：真的,感觉" autocomplete="off" spellcheck="false"></label>
      </div>
    </div>
  </aside>
</main>

<section class="panel insights" id="insights" aria-label="洞察">
  <div class="panel-head">
    <div class="panel-title">
      <h2>洞察</h2>
      <span id="insightSub" class="panel-sub"></span>
    </div>
  </div>
  <div class="insight-grid" id="insightGrid"></div>
</section>

<section class="panel table-panel">
  <div class="panel-head">
    <div class="panel-title">
      <h2>评论表</h2>
      <span id="tableCount" class="panel-sub"></span>
    </div>
    <div class="inline">
      <input id="search" class="input" type="search" placeholder="搜索评论内容 / 昵称 / 抖音号…" autocomplete="off">
      <select id="sortBy" class="select">
        <option value="digg">按点赞降序</option>
        <option value="time">按时间降序</option>
        <option value="len">按字数降序</option>
        <option value="replies">按回复数降序</option>
      </select>
      <button id="btnExport" class="btn small" type="button" disabled>导出 CSV</button>
          <button id="btnExportJson" class="btn small" type="button" disabled>导出 JSON</button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th class="col-text">评论内容</th>
          <th class="col-user">用户</th>
          <th class="col-num">点赞</th>
          <th class="col-num">回复</th>
          <th class="col-ip">属地</th>
          <th class="col-time">时间</th>
          <th class="col-level">层级</th>
          <th class="col-sent">情感</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="tableEmpty" class="empty small">没有符合条件的评论</div>
    <div id="skTable" class="sk-table" aria-hidden="true" hidden></div>
  </div>
  <nav id="pager" class="pager"></nav>
</section>

<footer class="foot">
  <span>本地静态页面 · 数据不上传</span>
  <span>点昵称跳抖音主页（需导出数据带 sec_uid）</span>
  <span id="uiVer">v0.5.54</span>
</footer>

<div id="tooltip" class="tooltip hidden" role="tooltip"></div>

<aside id="drawer" class="drawer hidden" aria-label="关键词评论列表">
  <div class="drawer-head">
    <div>
      <h3 id="drawerTitle">关键词</h3>
      <p id="drawerSub" class="meta"></p>
    </div>
    <button id="btnCloseDrawer" class="btn ghost small" type="button">关闭</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
  <div class="drawer-foot">
    <button id="btnDrawerMore" class="btn small" type="button">加载更多</button>
    <button id="btnDrawerFilter" class="btn small" type="button">在评论表里筛选这个词</button>
  </div>
</aside>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=0.5.54"></script>
</body>
</html>
