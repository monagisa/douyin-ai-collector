<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词云 · 评论分析台</title>
<!-- v0.5.49：云图专用页。首帧只给一个纯内联的「正在载入」占位（不依赖任何外部 CSS），
     避免出现「黑底 + 三个点」的空状态一闪；数据从 chrome.storage.local.dts_cloud_view 读，
     读到后整页换成完整分析台（样式由 app.js 内联注入）。 -->
<style id="bootCss">
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0b0b0c;
    color: #d3d3d6;
    font: 14px/1.6 "Segoe UI", Inter, "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  .boot {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 22px;
    border: 1px solid #27272b; border-radius: 10px;
    background: #131315;
  }
  .boot .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e0a94a;
    animation: pulse 1.1s ease-in-out infinite;
  }
  .boot .txt { font-size: 13px; color: #a3a3a8; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.9) } 50% { opacity: 1; transform: scale(1) } }
</style>
</head>
<body>
  <div class="boot"><span class="dot"></span><span class="txt">正在载入词云…</span></div>
  <!-- ?v= 破缓存：否则重装扩展后本页仍跑旧 app.js（v0.5.51 前的卡片尺寸算法） -->
<script src="app.js?v=0.5.54"></script>
</body>
</html>
